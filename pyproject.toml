[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-jev"
version = "0.1.0"
description = "Apple-Silicon-first training stack for fast, calibrated structured decisions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "mlx>=0.28.0",
  "mlx-lm>=0.27.0",
  "numpy>=2.0",
  "orjson>=3.10",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["datasets>=3.0", "huggingface-hub>=0.25"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
open-jev = "open_jev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

